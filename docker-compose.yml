# All services share one user-defined bridge network. MCP/demo reach HydraDB
# by service name (http://hydradb:8443). Do not use network_mode: host — that
# breaks Docker Desktop for Mac/Windows (where judges run).
#
# Note for some Linux hosts with incomplete Docker iptables (not Docker Desktop):
# if peer TCP to hydradb:8443 times out, or containers cannot reach the internet
# for the embed model, Docker may only wire docker0. Fix the root cause — do not
# fall back to network_mode: host:
#   sudo iptables -I DOCKER-USER -i br-+ -o br-+ -j ACCEPT
#   sudo iptables -I DOCKER-USER -i br-+ ! -o br-+ -j ACCEPT
#   sudo iptables -I DOCKER-USER -o br-+ -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
#   # MASQUERADE compose subnet (inspect network for the actual CIDR):
#   sudo iptables -t nat -A POSTROUTING -s 172.18.0.0/16 ! -o docker0 -j MASQUERADE
# Docker Desktop Mac/Windows already wires user-defined bridges correctly.
services:
  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    user: "0:0"
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_ALLOW_PLAINTEXT: "true"
      GRAPH_USAGE_REPORT_ENABLED: "false"
      GRAPH_AUTH_TOKEN_FILE: /var/run/secrets/slatedb-graph/auth-token
    volumes:
      - hydradb_data:/data/store
      - ./deploy/hydra-auth-token:/var/run/secrets/slatedb-graph/auth-token:ro
    ports:
      - "8443:8443"
    networks: [toolgraph]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8443'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  mcp:
    build: .
    depends_on:
      hydradb:
        condition: service_healthy
    environment:
      HYDRA_URL: http://hydradb:8443
      HYDRA_TOKEN: local-development-token-32-bytes
      DEMO_SEED_LEARN: "1"
      DEMO_SEED: "7"
      DEMO_ALLOW_WRITES: "1"
      FASTEMBED_CACHE_PATH: /app/fastembed_cache
    ports:
      - "8080:8080"
    networks: [toolgraph]
    command: ["python", "-m", "toolgraph.mcp_server", "--http", "8080", "--http-only"]
    restart: on-failure

  demo:
    build: .
    depends_on:
      hydradb:
        condition: service_healthy
    environment:
      HYDRA_URL: http://hydradb:8443
      HYDRA_TOKEN: local-development-token-32-bytes
      DEMO_PORT: "5000"
      DEMO_SEED_LEARN: "1"
      DEMO_SEED: "7"
      DEMO_ALLOW_WRITES: "1"
      FASTEMBED_CACHE_PATH: /app/fastembed_cache
    ports:
      - "5000:5000"
    networks: [toolgraph]
    command: ["python", "-m", "demo.app"]
    restart: on-failure

networks:
  toolgraph:
    driver: bridge

volumes:
  hydradb_data:
