services:
  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    ports:
      - "8443:8443"
      - "7687:7687"
      - "9090:9090"
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_BOLT_ADDR: 0.0.0.0:7687
      GRAPH_HTTP_ADDR: 0.0.0.0:8443
      GRAPH_ADMIN_ADDR: 0.0.0.0:9090
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_DATA_CACHE_BYTES: "67108864"
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      GRAPH_USAGE_REPORT_ENABLED: "false"
    volumes:
      - hydra_store:/data/store
      - hydra_cache:/data/cache
      - ./deploy/auth-token:/data/auth-token:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8443/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PYTHONPATH: /app
      HYDRA_URL: http://hydradb:8443
      # JEV_API_KEY is optional at runtime; pass via .env, never commit it.
      JEV_API_KEY: ${JEV_API_KEY:-}
    depends_on:
      hydradb:
        condition: service_healthy
    volumes:
      - ./results:/app/results
      - ./data:/app/data:ro

volumes:
  hydra_store:
  hydra_cache:
